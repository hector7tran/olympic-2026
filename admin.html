<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SEHC Olympic 2026 - Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script><style>
:root{--brand:#1428a0;--bg:#f4f7fb;--card:#fff;--line:#e3e7ef;--bad:#c92a2a}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial;background:var(--bg);color:#182033}.top{background:#1428a0;color:#fff;padding:17px 20px;display:flex;justify-content:space-between;align-items:center}.top h1{font-size:19px;margin:0}.wrap{max-width:1250px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #edf0f5;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0000000b}.login{max-width:420px;margin:70px auto}.field{margin-bottom:10px}.field label{font-size:12px;font-weight:700;display:block;margin-bottom:4px}.field input,.field select{width:100%;padding:10px;border:1px solid #d8deea;border-radius:9px;font-size:14px}.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:800;cursor:pointer;background:var(--brand);color:#fff}.btn.alt{background:#eef1ff;color:var(--brand)}.btn.bad{background:#fff0f0;color:var(--bad)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select{padding:9px;border:1px solid #d8deea;border-radius:8px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.stat{padding:12px;background:#f7f8ff;border-radius:10px}.stat b{display:block;font-size:22px;color:var(--brand)}.emp-total{background:linear-gradient(135deg,#1428a0,#2748d8);color:#fff;border-radius:12px;padding:16px;text-align:center;margin-bottom:14px}.emp-total b{font-size:32px;display:block;line-height:1.2}.emp-total span{font-size:12px;opacity:.85}.emp-sport{margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line)}.emp-sport:last-child{border-bottom:0;margin-bottom:0}.emp-sport-title{font-weight:700;font-size:13px;margin-bottom:6px;color:var(--brand)}.emp-content{display:flex;justify-content:space-between;padding:3px 0 3px 14px;font-size:12px;color:#666}.emp-content b{color:#1428a0}.tableWrap{overflow:auto}.topScrollbar{overflow-x:auto;overflow-y:hidden;height:16px;margin-bottom:4px}.topScrollbar div{height:1px}table{border-collapse:collapse;width:100%;min-width:1250px;font-size:12px}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{background:#f8f9fb;position:sticky;top:0}.msg{font-size:13px;color:var(--bad);margin:8px 0}.hidden{display:none}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:15px;z-index:10}.modal.hidden{display:none}.modalBox{background:#fff;border-radius:14px;padding:18px;width:min(720px,100%);max-height:90vh;overflow:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.wrap{padding:10px}}
</style></head><body>
<div class="top"><h1>SEHC Olympic 2026 &middot; Admin</h1><button id="logout" class="btn alt hidden">Đăng xuất</button></div>
<div class="wrap"><div id="loginBox" class="card login"><h2>Đăng nhập BTC</h2><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Mật khẩu</label><input id="password" type="password"></div><div id="loginMsg" class="msg"></div><button id="loginBtn" class="btn">Đăng nhập</button></div>
<div id="app" class="hidden"><div class="card"><div id="stats" class="stats"></div></div><div class="card"><h3 style="margin:0 0 10px;font-size:15px">Thống kê nhân viên tham gia</h3><div id="totalEmp" class="emp-total"></div><div id="empStats"></div></div><div class="card"><div class="toolbar"><input id="q" placeholder="Tìm ID, tên, đội..."><select id="sportFilter"><option value="">Tất cả môn</option></select><button id="exportBtn" class="btn">Download Excel</button><button id="refreshBtn" class="btn alt">Refresh</button></div><div id="topScrollbar" class="topScrollbar" style="display:none"><div style="height:1px"></div></div><div class="tableWrap"><table><thead><tr><th>Thời gian</th><th>Môn</th><th>Nội dung</th><th>Đội</th><th>Captain ID</th><th>Captain</th><th>Phone</th><th>P2</th><th>P3</th><th>P4</th><th>P5</th><th>Ký quỹ</th><th>Mã đăng ký</th><th>Thao tác</th></tr></thead><tbody id="tbody"></tbody></table></div></div></div></div>
<div id="modal" class="modal hidden"><div class="modalBox"><h3>Chỉnh sửa đăng ký</h3><div id="editFields"></div><div class="toolbar"><button id="saveBtn" class="btn">Lưu thay đổi</button><button id="cancelBtn" class="btn alt">Hủy</button></div><div id="editMsg" class="msg"></div></div></div>
<script>
const SUPABASE_URL='https://zvyukjmuddzqkpjatinn.supabase.co';const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp2eXVram11ZGR6cWtwamF0aW5uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2NzA3NDEsImV4cCI6MjEwMjI0Njc0MX0.kTFdDFitfm3WSfhZEG8h_tCwSs-KCwk9JE0Jfcp7iL0';const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const SPORTS={'Liên Quân mobile':{contents:['Đồng đội (5 người)']},'Bi lắc':{contents:['Đồng đội (4 người)']},'Bi-da':{contents:['Đồng đội (4 người)']},'Cầu lông':{contents:['Đôi nam','Đôi nữ','Đôi nam nữ']},'Pickleball':{contents:['Đôi nam','Đôi nữ','Đôi nam nữ']}};const $=s=>document.querySelector(s);const esc=(v='')=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'\u0026amp;','<':'\u0026lt;','>':'\u0026gt;',"'":'\u0026#39;','"':'\u0026quot;'}[c]));Object.keys(SPORTS).forEach(s=>$('#sportFilter').add(new Option(s,s)));let rows=[],editing=null;
async function boot(){const {data:{session}}=await db.auth.getSession();session?showApp():showLogin()}function showLogin(){$('#loginBox').classList.remove('hidden');$('#app').classList.add('hidden');$('#logout').classList.add('hidden')}async function showApp(){$('#loginBox').classList.add('hidden');$('#app').classList.remove('hidden');$('#logout').classList.remove('hidden');await load()}
$('#loginBtn').onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});if(error){$('#loginMsg').textContent=error.message;return}showApp()};$('#logout').onclick=async()=>{await db.auth.signOut();showLogin()};
async function load(){const {data,error}=await db.from('registrations').select('*').order('created_at',{ascending:false});if(error){alert('Không tải được dữ liệu. Kiểm tra tài khoản admin/RLS: '+error.message);return}rows=data||[];render()}
function render(){const f=$('#sportFilter').value,q=$('#q').value.trim().toLowerCase();const filtered=rows.filter(r=>(!f||r.sport===f)&&(!q||JSON.stringify(r).toLowerCase().includes(q)));const sportKeys=Object.keys(SPORTS);$('#stats').innerHTML=sportKeys.map(s=>`<div class="stat"><b>${rows.filter(r=>r.sport===s).length}</b><span>${esc(s)}</span></div>`).join('');const getIds=r=>[r.captain_id,r.player2_id,r.player3_id,r.player4_id,r.player5_id].filter(Boolean);const allIds=new Set();rows.forEach(r=>getIds(r).forEach(id=>allIds.add(id)));$('#totalEmp').innerHTML=`<b>${allIds.size}</b><span>Tổng nhân viên tham gia (không tính trùng ID)</span>`;$('#empStats').innerHTML=sportKeys.map(sport=>{const sr=rows.filter(r=>r.sport===sport);const sIds=new Set();sr.forEach(r=>getIds(r).forEach(id=>sIds.add(id)));const ch=SPORTS[sport].contents.map(c=>{const cr=sr.filter(r=>r.competition_content===c);const cIds=new Set();cr.forEach(r=>getIds(r).forEach(id=>cIds.add(id)));return `<div class="emp-content"><span>${esc(c)}</span><b>${cIds.size} NV</b></div>`}).join('');return `<div class="emp-sport"><div class="emp-sport-title">${esc(sport)} &middot; ${sIds.size} NV</div>${ch}</div>`}).join('');$('#tbody').innerHTML=filtered.map(r=>`<tr><td>${new Date(r.created_at).toLocaleString('vi-VN')}</td><td>${esc(r.sport)}</td><td>${esc(r.competition_content)}</td><td><b>${esc(r.team_name)}</b></td><td>${esc(r.captain_id)}</td><td>${esc(r.captain_name)}</td><td>${esc(r.captain_phone)}</td><td>${esc(r.player2_id)} ${esc(r.player2_name)}</td><td>${esc(r.player3_id)} ${esc(r.player3_name)}</td><td>${esc(r.player4_id)} ${esc(r.player4_name)}</td><td>${esc(r.player5_id)} ${esc(r.player5_name)}</td><td>${r.is_deposited?'Đã ký quỹ':'Chưa'}</td><td>${esc(r.registration_code || '')}</td><td><button class="btn alt" onclick="editRow('${r.id}')">Sửa</button> <button class="btn bad" onclick="delRow('${r.id}')">Xóa</button></td></tr>`).join('');setTimeout(syncScrollbars,50)}
function syncScrollbars(){const w=$('.tableWrap'),s=$('#topScrollbar');if(!w||!s)return;const sw=w.scrollWidth,cw=w.clientWidth;if(sw>cw){s.style.display='block';$('#topScrollbar div').style.width=sw+'px';s.scrollLeft=w.scrollLeft}else{s.style.display='none'}}
$('#q').oninput=render;$('#sportFilter').onchange=render;$('#refreshBtn').onclick=load;
$('#topScrollbar').onscroll=()=>{$('.tableWrap').scrollLeft=$('#topScrollbar').scrollLeft};
$('.tableWrap').onscroll=()=>{$('#topScrollbar').scrollLeft=$('.tableWrap').scrollLeft};
window.addEventListener('resize',syncScrollbars);
window.delRow=async id=>{if(!confirm('Xóa đăng ký này? Thao tác không thể hoàn tác.'))return;const {error}=await db.from('registrations').delete().eq('id',id);if(error)return alert(error.message);await load()};
window.editRow=id=>{editing=rows.find(r=>r.id===id);const keys=['sport','competition_content','team_name','captain_id','captain_name','captain_phone','player2_id','player2_name','player3_id','player3_name','player4_id','player4_name','player5_id','player5_name'];$('#editFields').innerHTML='<div class="grid">'+keys.map(k=>`<div class="field"><label>${k}</label><input data-k="${k}" value="${esc(editing[k]??'')}"></div>`).join('')+`<div class="field"><label>Ký quỹ</label><select data-k="is_deposited"><option value="false" ${!editing.is_deposited?'selected':''}>Chưa</option><option value="true" ${editing.is_deposited?'selected':''}>Đã ký quỹ</option></select></div></div>`;$('#modal').classList.remove('hidden')};$('#cancelBtn').onclick=()=>$('#modal').classList.add('hidden');
$('#saveBtn').onclick=async()=>{const p={};document.querySelectorAll('#editFields [data-k]').forEach(el=>p[el.dataset.k]=el.dataset.k==='is_deposited'?el.value==='true':(el.value.trim()||null));const {error}=await db.from('registrations').update(p).eq('id',editing.id);if(error){$('#editMsg').textContent=error.message;return}$('#modal').classList.add('hidden');await load()};
$('#exportBtn').onclick=()=>{const out=rows.map((r,i)=>({'No.':i+1,'Created at':new Date(r.created_at).toLocaleString('vi-VN'),'Sport':r.sport,'Competition content':r.competition_content,'Team name':r.team_name,'Captain ID':r.captain_id,'Captain name':r.captain_name,'Captain phone':r.captain_phone,'Player2 ID':r.player2_id,'Player2 name':r.player2_name,'Player3 ID':r.player3_id,'Player3 name':r.player3_name,'Player4 ID':r.player4_id,'Player4 name':r.player4_name,'Player5 ID':r.player5_id,'Player5 name':r.player5_name,'Deposited':r.is_deposited?'Yes':'No','Registration Code':r.registration_code||'','Registration ID':r.id}));const ws=XLSX.utils.json_to_sheet(out);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Registrations');XLSX.writeFile(wb,'SEHC_Olympic_2026_Registrations.xlsx')};boot();
</script></body></html>
